# HugoBlox Font Pack
# https://docs.hugoblox.com
# Matches Cecilia's LaTeX resume, which is set throughout in Avant Garde /
# URW Gothic (\fontfamily{qag}). Jost is the closest free geometric-sans
# equivalent available on Google Fonts.

hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Resume"
    vendor: "cecilia-ferrari"
    version: "1.0.0"
    license: "MIT"
    style: "sans"
    description: "Geometric sans matching the Avant Garde / URW Gothic resume typeface"

  families:
    heading: "Jost"
    body: "Jost"
    code: "JetBrains Mono"

  weights:
    heading: [500, 600, 700]
    body: [400, 500, 600]
    code: [400]

  leading:
    heading: 1.2
    body: 1.6
    code: 1.5

  tracking:
    heading: "0"
    body: "0"

  variable:
    heading: true
    body: true
    code: false
