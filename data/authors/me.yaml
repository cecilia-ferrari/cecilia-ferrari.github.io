role: PhD Candidate in Astroparticle Physics
bio: |
  I am interested in detector R&D for Beyond Standard Model physics experiments. I have experience in neutrino mass physics, nuclear physics in ultra-low-background experiments, and WIMP and light dark matter searches. I have characterized and refined pulse-processing tools for several low-temperature devices, including multiplexed TESs, the ABALONE prototype and SiPMs, and have conducted several data analysis and sensitivity studies.

