experience:
  - role: PhD Researcher — XENON, DARWIN & XLZD Collaborations, DAREDEVIL project
    org: Laboratori Nazionali del Gran Sasso (Assergi, Italy)
    start: 2021-07-01
    summary: |
      - Member of the DAREDEVIL light dark matter project: light dark matter sensitivity studies with milli-Kelvin macrocalorimeters using a GaAs semiconductor target.
      - Co-leader of the high-energy electronic-recoil (ER) XENONnT analysis group: coordination of the analysis group and development of the background modeling and fitting framework for XENONnT high-energy electron recoil analyses.
      - Data analysis for nuclear physics and WIMP searches: measured $^{212}$Pb and $^{214}$Pb beta decay branching ratios with the XENONnT experiment; developed a physics-driven 6D model of the surface background for XENONnT WIMP searches with flamedisx, in participation with the LZ Collaboration.
      - Run Coordinator of the XENONnT experiment: one month as Run Coordinator, following calibration campaigns, monitoring every experimental sub-system, and coordinating on-site shifters and expert operations.
  - role: Visiting PhD Student
    org: Stockholm University (Stockholm, Sweden)
    start: 2022-06-01
    end: 2022-06-30
    summary: |
      Supervisors: J. Conrad and J. Mahlstedt.

      - First characterization of the novel ABALONE photosensor in a cryostat.
      - Development of the flamedisx software for WIMP inference studies.
  - role: Master Thesis — HOLMES Experiment
    org: Milano-Bicocca University (Milan, Italy)
    start: 2019-12-01
    end: 2020-10-31
    summary: |
      - Characterization of a TES-based microcalorimeter multiplexed array: evaluation of V-I curves and thermal conductances to the bath of 16 TESs coupled to multiplexed RF-SQUID NIST μmux17a chips.
      - Studies for a novel pulse filtering technique to process pile-up events, resulting in a 19% improvement of HOLMES sensitivity on neutrino mass. Corresponding author of a paper and a proceeding.
  - role: Summer Student Internship — CLICdp Experiment
    org: CERN, EP Department (Geneva, Switzerland)
    start: 2019-06-01
    end: 2019-09-30
    summary: |
      Long-lived particle detection sensitivity studies for the proposed Compact Linear Collider (CLICdp) experiment.
  - role: Bachelor Thesis — CMS MTD Milano-Bicocca Group
    org: Milano-Bicocca University (Milan, Italy)
    start: 2018-06-01
    end: 2018-10-31
    summary: |
      Characterization and noise analysis of a LYSO-coupled SiPM prototype for the CMS MTD Barrel Timing Layer.

