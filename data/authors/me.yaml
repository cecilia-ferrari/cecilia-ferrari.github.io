  - Direct dark matter detection (XENONnT, DARWIN, XLZD)
  - Light dark matter searches with low-temperature detectors
  - Neutrino mass physics
  - Nuclear physics in ultra-low-background experiments
  - Low-temperature devices (TES, ABALONE, SiPMs)

